name: Strategy Scanner Bot

on:
  schedule:
    # Hafta içi her 15 dakikada bir çalışır (Pzt-Cum)
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: # Manuel çalıştırma butonu

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Repositoriyi Klonla
      uses: actions/checkout@v3

    - name: Python Ortamını Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Botu Çalıştır
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python breakout_bot.py
